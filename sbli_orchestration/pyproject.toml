[project]
name = "sbli_orchestration"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.11",
    "dagster-dbt>=0.29.11",
    "dagster-snowflake>=0.29.11",
    "dbt-snowflake>=1.11.6",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "sbli_orchestration"
registry_modules = [
    "sbli_orchestration.components.*",
]


